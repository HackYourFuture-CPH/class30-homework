<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>JS Week 1</title>
</head>
<body>
    <div class="ageIfy">
        <p class="appTagLine">This app will calculate your age for any given year</p>
        <label for="birthYear">Enter your birth year</label>
        <input id="birthYear" type="number" required min="1900" max="2011" size="4">
        <label for="futureYear">Enter the future year</label>
        <input id="futureYear" type="number" required min="2024" max="2111" size="4">
        <p class="result">You will be <span class="age"></span> years old in <span class="futureYear"></span></p>
    </div>
    <script src="./scripts.js"></script>
</body>
</html>
