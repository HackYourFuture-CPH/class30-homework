      <input type="checkbox" id="add-lord">

    let fName=document.getElementById(`fname`).value;

    getFullname(fName,lName,titleLord);

      ">Print my ticket</button>

  </div>
  
  <script>
    function getFullname(firstname,surName,addLord){
      let fullname=``;
      if(addLord){
         fullname= `Lord`+` `+firstname+` `+surName;
      }
      else{ fullname= firstname+` `+surName;}
      document.getElementById(`fullname`).value=fullname
    
  }
  </script>
