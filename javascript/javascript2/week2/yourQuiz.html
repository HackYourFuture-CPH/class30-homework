<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="yourQuizz.css">
    <title>Document</title>

</head>

<body>
    <div class="panel-add">
        <div class="exit">
            <button onclick="location.href='home.html'" id="exit-btn">Exit</button>
        </div>
        <h1> Add Questions </h1>

        <div class="add-question">
            <input type="text" id="questions" name="questions" placeholder="Add your question">
        </div>
        <div class="add-options">
            <label for="option1">Option 1</label>
            <input type="text" id="option1" name="option1">
            <label for="option2">Option 2</label>
            <input type="text" id="option2" name="option2">
            <label for="option3">Option 3</label>
            <input type="text" id="option3" name="option3">
            <label for="option4">Option 4</label>
            <input type="text" id="option4" name="option4">

            <label for="topic">Topic</label>
            <input type="text" id="topic" name="topic">
            <label for="answer">Answer</label>
            <input type="text" id="answer" name="answer">
            <button class="btn-question" id="add-question">Add Question</button>

        </div>


    </div>
</body>

</html>
