<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>

</head>

<body>
    <div class="panel">   
        <div class="exit-btn">
            <button onclick="location.href='home.html'" id="exit-btn">Exit</button>
        </div>
    
        <h1> Quiz Application </h1>
        <div class="timer"> Time left: <span id="timer">10</span> </div>

        <div class="panel-right"> Total Questions: 10 </div>
        <div class="quiz">
            <h2 id="question">Question here</h2>
            <div id="option-buttons">
                <button class="btn">Answer 1 </button>
                <button class="btn">Answer 2 </button>
                <button class="btn">Answer 3 </button>
                <button class="btn">Answer 4 </button>
                <button class="btn">Answer 5 </button>
            </div>
        </div>
        <div class="controls">

            <button class="btn" id="next-btn">Next</button>
        </div>
     
    </div>
 
    <script src="script.js"> </script>

</body>
